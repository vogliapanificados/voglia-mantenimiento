<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#005499">
  <meta name="description" content="Fallas, reparaciones y mantenimiento de las máquinas de Voglia.">
  <title>Voglia Mantenimiento</title>
  <!-- Instalación en el celular (PWA) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Voglia">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <!-- Barra superior: título y botón "volver" -->
  <header id="barra" class="barra oculto">
    <button id="btn-volver" class="barra-volver oculto" aria-label="Volver">‹</button>
    <h1 id="titulo">Voglia Mantenimiento</h1>
  </header>
  <!-- Sin conexión / cargas sin enviar / cargas con problema -->
  <div id="franja" class="franja oculto" role="status"></div>

  <!-- Acá se dibuja la pantalla actual -->
  <main id="app" class="contenido">
    <div class="cargando-pantalla"><div class="spinner"></div></div>
  </main>

  <!-- Menú inferior (cambia según el rol) -->
  <nav id="menu" class="menu oculto"></nav>

  <!-- Mensajes cortos y ventanas de confirmación -->
  <div id="avisos" class="avisos" aria-live="polite"></div>
  <div id="modal" class="modal oculto" role="dialog" aria-modal="true"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
